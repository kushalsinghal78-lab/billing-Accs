name: Build Mom's Pride APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Verify Node and Java
        run: |
          set -e
          node --version
          npm --version
          java --version

      - name: Verify project structure
        shell: bash
        run: |
          set -e
          echo "Repository root:"
          pwd
          echo ""
          echo "Required project files:"
          ls -la
          ls -la www
          test -f package.json
          test -f capacitor.config.ts
          test -f www/index.html
          test -f www/app.js
          test -f www/styles.css
          test -f www/manifest.json
          echo "Project structure OK."

      - name: Install dependencies
        run: npm install

      - name: Verify Capacitor CLI
        run: npx cap --version

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK created successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moms-Pride-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
